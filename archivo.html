<style>
:root{
  --ink:#1B2F45; --muted:#5F7286; --line:#B9C9D4; --signal:#E3A21A; --bg:#EEF3F6; --card:#FFFFFF; --hot:#2E8B57;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --ink:#E6EEF4; --muted:#93A6B8; --line:#35506A; --signal:#F0B43A; --bg:#0D1823; --card:#172636; --hot:#4CC18A; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--signal)}
.how{font-size:.85rem;color:var(--muted);margin:0}
a{color:var(--ink)}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.day .d{font-weight:600}
.day .d small{display:block;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.g{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);text-decoration:none;font-weight:600;font-size:.88rem;white-space:nowrap}
.g:hover{border-color:var(--signal)}
.g:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.g.done{border-style:dashed;color:var(--muted);font-weight:500}
.g.done b{color:var(--hot)}
.g.na{visibility:hidden}
.osm{font-size:.8rem;color:var(--muted);margin:0}
.osm a{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Días<br><span>anteriores</span></h1>
  <p class="how">¿Te perdiste algún día? Aquí están todos los retos pasados. Los que juegues aquí no cuentan para tus estadísticas ni para la liga. Volver al reto de hoy: <a href="./">¿Dónde está?</a> · <a href="letras.html">Letras del día</a></p>
  <ol class="days" id="days"></ol>
  <div class="ad-slot"></div>
  <p class="osm"><a href="https://ko-fi.com/pascualmunoz" target="_blank" rel="noopener">Invítame a un café</a> · <a href="profes.html">Retos para clase</a> · <a href="privacidad.html">Privacidad</a></p>
</div>
<script src="ads.js"></script>
<script>
// Mismas fechas de inicio y numeración que los juegos
const DONDE0=new Date(2026,10,13),LETRAS0=new Date(2026,10,14);
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dnum=d=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5)+1;
const lnum=d=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,10,14))/864e5)+1;
const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
function donde(d){const s=get("dd-"+dkey(d)),u="./?dia="+dkey(d);
  if(s&&s.done){const p=s.won?Math.max(1,10-2*(s.guesses.length-1)):0;return`<a class="g done" href="${u}">📍 <b>${p}</b>/10</a>`}
  return`<a class="g" href="${u}">📍 Jugar</a>`}
function letras(d){if(d<LETRAS0)return`<span class="g na">🔤</span>`;
  const s=get("lt-"+dkey(d)),u="letras.html?dia="+dkey(d);
  if(s&&s.done){const p=(s.res||[]).reduce((a,r)=>a+(r.pts||0),0);return`<a class="g done" href="${u}">🔤 <b>${p}</b>/25</a>`}
  return`<a class="g" href="${u}">🔤 Jugar</a>`}
const out=[],d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-1);
for(;d>=DONDE0;d.setDate(d.getDate()-1)){
  const f=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  out.push(`<li class="day"><span class="d">${f[0].toUpperCase()+f.slice(1)}<small>¿Dónde está? nº ${dnum(d)}${d>=LETRAS0?` · Letras nº ${lnum(d)}`:""}</small></span>${donde(new Date(d))}${letras(new Date(d))}</li>`)}
document.getElementById("days").innerHTML=out.join("")||`<li class="how">Todavía no hay días anteriores.</li>`;
</script>
</body>
</html>
